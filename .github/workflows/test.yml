name: Snatch checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  game-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Dependency security audit
        run: |
          npm audit --json > audit.json || true
          node -e 'const a=require("./audit.json"); const v=a.metadata?.vulnerabilities||{}; console.log("Vulnerability totals:", JSON.stringify(v)); for (const [name,item] of Object.entries(a.vulnerabilities||{})) console.log(name, item.severity, "fix:", JSON.stringify(item.fixAvailable));'
      - name: Expo project health
        run: npx expo-doctor
      - run: npx expo export --platform ios
