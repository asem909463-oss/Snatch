name: Snatch checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  game-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx expo export --platform ios
