name: Snatch checks
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  game-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: npm test
      - name: Dependency security audit
        run: |
          npm audit --json > audit.json || true
          node -e 'const a=require("./audit.json"); const v=a.metadata?.vulnerabilities||{}; console.log("Vulnerability totals:", JSON.stringify(v)); for (const [name,item] of Object.entries(a.vulnerabilities||{})) { const via=(item.via||[]).map(x=>typeof x==="string"?x:{title:x.title,url:x.url,range:x.range,fixAvailable:x.fixAvailable}); console.log(name, item.severity, "range:", item.range, "via:", JSON.stringify(via), "fix:", JSON.stringify(item.fixAvailable)); } if ((v.high||0)+(v.critical||0)>0) process.exit(1);'
      - name: Expo project health
        run: npx expo-doctor
      - run: npx expo export --platform ios
      - name: Upload dependency lockfile and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snatch-dependency-report
          path: |
            package-lock.json
            audit.json
          if-no-files-found: ignore
          retention-days: 7

  ios-simulator-smoke:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Generate iOS project
        run: CI=1 npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Compile for iOS Simulator
        run: xcodebuild -workspace ios/Snatch.xcworkspace -scheme Snatch -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build
      - name: Launch app in iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone .* \([A-F0-9-]{36}\)' | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/Snatch.app"
          xcrun simctl launch "$DEVICE_ID" com.turzam.snatch
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/snatch-simulator.png"
      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snatch-ios-simulator-smoke
          path: ${{ runner.temp }}/snatch-simulator.png
          if-no-files-found: ignore
          retention-days: 7
