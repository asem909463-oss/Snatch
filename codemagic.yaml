workflows:
  ios-app-store:
    name: Turzam Rush - iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: com.turzam.snatch
        XCODE_WORKSPACE: ios/Snatch.xcworkspace
        XCODE_SCHEME: Snatch
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.turzam.snatch

    scripts:
      - name: Install JavaScript dependencies
        script: npm install
      - name: Generate native iOS project
        script: npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Apply App Store signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
